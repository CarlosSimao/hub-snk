# Atualizações de dependência abertas como pull request, uma vez por mês: num
# projeto de um mantenedor, a frequência semanal viraria ruído ignorado.
#
# Contra a `dev`, como todo o resto: a `main` só recebe o PR da release, já testado.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

  # O shell desktop tem o próprio package.json: Electron e electron-builder.
  - package-ecosystem: npm
    directory: /desktop
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
