# Atualizações de dependência abertas como pull request, uma vez por mês: num
# projeto de um mantenedor, a frequência semanal viraria ruído ignorado.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
