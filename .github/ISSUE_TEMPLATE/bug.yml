name: Relatar um erro
description: Algo que parou de funcionar, deu mensagem de erro ou se comporta de um jeito estranho.
title: '[bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Este repositório é público.** Não cole o conteúdo do `clientes.json`, nem trechos de log
        com nome de cliente, host, usuário ou senha. Troque por `<cliente>` e `<host>`: para o
        diagnóstico o que importa é a forma da mensagem, não os valores reais.

  - type: input
    id: versao
    attributes:
      label: Versão do HUB SNK
      description: Aparece no rodapé da tela.
      placeholder: v1.2.0
    validations:
      required: true

  - type: dropdown
    id: sistema
    attributes:
      label: Sistema operacional
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Versão do Node.js
      description: Saída de `node -v`.
      placeholder: v22.18.0
    validations:
      required: true

  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Descreva o problema e onde ele aparece — qual tela, qual botão.
    validations:
      required: true

  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      description: Passo a passo até o erro acontecer.
      placeholder: |
        1. Abrir o cliente X
        2. Clicar no botão de recarregar
        3. ...
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava que acontecesse
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log do servidor (opcional)
      description: A janela do terminal onde o HUB SNK está rodando. Revise antes de colar.
      render: shell

  - type: checkboxes
    id: sem-dados-sensiveis
    attributes:
      label: Confirmação
      options:
        - label: Reli o que escrevi e não há senha, host, usuário nem nome de cliente no texto.
          required: true
