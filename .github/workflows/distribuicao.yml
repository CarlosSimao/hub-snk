name: Distribuição

# Gera o instalador do aplicativo desktop a cada tag de versão e anexa à release
# correspondente.
#
# Um workflow só, com um job de publicação no fim: dois workflows disparados
# pela mesma tag disputariam a criação da release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # O Git AutoSync entra no instalador (decisão D7 do plano de migração) e mora em
  # outro repositório. A branch é a `master`: só ela tem o `install-standalone.ps1`
  # que o `installer.nsh` chama.
  REPOSITORIO_GIT_AUTOSYNC: FlavianoRS/git-autosync
  BRANCH_GIT_AUTOSYNC: master

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # Tag e `package.json` fora de sincronia gerariam um instalador com a versão
      # errada no nome e no "Sobre" do aplicativo.
      - name: Conferir a versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $esperada = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($arquivo in @('package.json', 'desktop\package.json')) {
            $versao = (Get-Content $arquivo -Raw | ConvertFrom-Json).version
            if ($versao -ne $esperada) { throw "$arquivo está na versão $versao, e a tag é $esperada." }
          }

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.REPOSITORIO_GIT_AUTOSYNC }}
          ref: ${{ env.BRANCH_GIT_AUTOSYNC }}
          path: git-autosync

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Gerar os binários do Git AutoSync
        shell: pwsh
        run: |
          python -m pip install -r git-autosync\python\requirements-dev.txt
          & git-autosync\python\build_windows.ps1

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Instalar dependências
        run: |
          npm ci
          npm --prefix desktop ci
          node desktop/node_modules/electron/install.js

      - name: Conferir tipos e testes
        run: |
          npm run typecheck
          npm test

      - name: Gerar o instalador
        env:
          GIT_AUTOSYNC_DIR: ${{ github.workspace }}\git-autosync
        run: npm run empacotar-desktop

      - uses: actions/upload-artifact@v7
        with:
          name: instalador-windows
          path: release/HUB-SNK-Setup-*.exe
          if-no-files-found: error

  publicar:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefatos
          merge-multiple: true

      - name: Anexar o instalador à release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh artefatos

          # A tag pode chegar antes de a release existir — nesse caso, cria.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi

          gh release upload "$TAG" artefatos/* --repo "$GITHUB_REPOSITORY" --clobber
