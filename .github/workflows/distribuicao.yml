name: Distribuição

# Monta os instaladores do Development Switch (shell Electron em desktop/) para
# Windows, Linux e macOS a cada tag de versão, e anexa tudo à release.
#
# Um SO por runner: o electron-builder não gera `.dmg` fora do macOS e o `.deb`
# precisa do fpm do Linux. Um workflow só, com a publicação no fim: dois workflows
# disparados pela mesma tag disputariam a criação da release.
#
# O Git AutoSync fica de fora (`empacotar:sem-autosync`): ele mora em outro
# repositório e o PyInstaller não faz cross-compile. O instalador com o AutoSync
# embutido é montado na máquina de quem tem o repositório dele.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  empacotar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: windows-latest
            nome: windows
            artefatos: |
              release/*.exe
          - so: ubuntu-latest
            nome: linux
            artefatos: |
              release/*.AppImage
              release/*.deb
          - so: macos-latest
            nome: macos
            artefatos: |
              release/*.dmg
              release/*.zip

    runs-on: ${{ matrix.so }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24: o backend usa `node:sqlite` e o `preparar-hub.mjs` roda o build dele.
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Instalar dependências
        run: |
          npm ci
          npm --prefix desktop ci

      - name: Conferir tipos e testes
        run: |
          npm run typecheck
          npm test

      - name: Empacotar
        env:
          # Sem certificado: impede o electron-builder de procurar um no keychain do runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm --prefix desktop run empacotar:sem-autosync -- --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: instalador-${{ matrix.nome }}
          path: ${{ matrix.artefatos }}
          if-no-files-found: error

  publicar:
    needs: [empacotar]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefatos
          merge-multiple: true

      - name: Anexar os instaladores à release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh artefatos

          # A tag pode chegar antes de a release existir — nesse caso, cria.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi

          gh release upload "$TAG" artefatos/* --repo "$GITHUB_REPOSITORY" --clobber
