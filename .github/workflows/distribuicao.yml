name: Distribuição

# Monta os pacotes do Windows, do Linux e do macOS a cada tag de versão, e anexa
# tudo à release correspondente.
#
# Um workflow só, com um job de publicação no fim: dois workflows disparados
# pela mesma tag disputariam a criação da release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.18'

      - name: Instalar dependências
        run: npm ci

      - name: Conferir tipos e testes
        run: |
          npm run typecheck
          npm test

      - name: Gerar os ícones
        run: npm run gerar-icones

      - name: Empacotar a distribuição
        run: npm run empacotar-windows

      # O script de instalação é o que o usuário roda depois de descompactar:
      # um erro de sintaxe nele só apareceria na máquina de quem baixou.
      - name: Conferir a sintaxe dos scripts de instalação
        shell: pwsh
        run: |
          foreach ($script in @('instalar-hub-snk.ps1', 'desinstalar-hub-snk.ps1')) {
            $erros = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path "instalador\$script"), [ref]$null, [ref]$erros) | Out-Null
            if ($erros.Count -gt 0) {
              $erros | ForEach-Object { Write-Host $_ }
              throw "$script tem erro de sintaxe."
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: pacote-windows
          path: dist/hub-snk-*-windows-x64.zip
          if-no-files-found: error

  unix:
    # No Linux para o `tar` preservar o bit de execução dos scripts — empacotar
    # no Windows entregaria um pacote cujo hub-snk.sh não roda do outro lado.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.18'

      - name: Instalar dependências
        run: npm ci

      - name: Empacotar Linux e macOS
        run: npm run empacotar-unix

      - name: Conferir se os scripts saíram executáveis
        run: |
          for pacote in dist/hub-snk-*.tar.gz; do
            for script in hub-snk.sh instalar-hub-snk.sh desinstalar-hub-snk.sh; do
              permissoes=$(tar -tzvf "$pacote" | grep -E "/$script$" | awk '{print $1}')
              echo "$pacote -> $script -> ${permissoes:-AUSENTE}"
              case "$permissoes" in
                -rwx*) ;;
                *) echo "O $script saiu do pacote sem permissão de execução." >&2; exit 1 ;;
              esac
            done
          done

      - uses: actions/upload-artifact@v7
        with:
          name: pacotes-unix
          path: dist/hub-snk-*.tar.gz
          if-no-files-found: error

  publicar:
    needs: [windows, unix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefatos
          merge-multiple: true

      - name: Anexar os artefatos à release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh artefatos

          # A tag pode chegar antes de a release existir — nesse caso, cria.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi

          gh release upload "$TAG" artefatos/* --repo "$GITHUB_REPOSITORY" --clobber
