name: CI

# Roda a cada push e a cada pull request. É a rede de segurança do projeto:
# nada entra na main sem passar por tipos, testes e formatação.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    # O backend continua rodando com o Node do sistema em desenvolvimento
    # (`npm run dev`), e o Node se comporta diferente entre os sistemas — foi
    # assim que a chamada do npm apareceu quebrada no Windows. A matriz cobre a
    # versão mínima suportada e a mais recente.
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.18', '24']

    runs-on: ${{ matrix.sistema }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir os tipos
        run: npm run typecheck

      - name: Rodar os testes
        run: npm test

      # Só uma vez: formatação não muda de sistema nem de versão do Node.
      - name: Conferir a formatação
        if: matrix.sistema == 'ubuntu-latest' && matrix.node == '24'
        run: npm run conferir-formato

  # O aplicativo desktop de ponta a ponta, sem esperar uma tag para descobrir que
  # a release quebrou: compila o shell, monta o backend como ele vai no pacote,
  # sobe esse backend no Node embutido do Electron e empacota a pasta do app.
  desktop:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Instalar dependências
        run: |
          npm ci
          npm --prefix desktop ci

      # O npm 11 bloqueia scripts de instalação por padrão, e o `postinstall` do
      # Electron é o que baixa o binário. Rodar o instalador dele de novo é
      # inofensivo quando o binário já está lá.
      - name: Garantir o binário do Electron
        run: node desktop/node_modules/electron/install.js

      - name: Compilar o shell
        run: npm --prefix desktop run build

      - name: Montar o backend do pacote
        run: node desktop/scripts/preparar-hub.mjs

      # Prova o que a Fase 1 do plano de migração provou à mão: o backend roda
      # direto do TypeScript no Node do Electron, só com as dependências de produção.
      - name: Subir o backend do pacote no Node do Electron
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:HUB_DADOS_DIR = Join-Path $env:RUNNER_TEMP 'dados-hub-snk'
          $electron = Resolve-Path 'desktop\node_modules\electron\dist\electron.exe'
          $backend = Start-Process $electron -ArgumentList 'src\index.ts' `
            -WorkingDirectory 'desktop\build\hub' -PassThru -NoNewWindow
          $pronto = $false
          foreach ($tentativa in 1..60) {
            try {
              Invoke-RestMethod http://127.0.0.1:4100/api/healthz | Out-Null
              $pronto = $true
              break
            } catch { Start-Sleep -Milliseconds 500 }
          }
          Stop-Process -Id $backend.Id -Force
          if (-not $pronto) { throw 'O backend do pacote não respondeu em /api/healthz.' }

      # Quem roda este script é o Windows PowerShell 5.1, chamado pelo NSIS: um erro
      # de sintaxe só apareceria na máquina de quem instalou.
      - name: Conferir a sintaxe do script de remoção da versão PWA
        shell: powershell
        run: |
          $erros = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'desktop\instalador\remover-versao-pwa.ps1'), [ref]$null, [ref]$erros) | Out-Null
          if ($erros.Count -gt 0) {
            $erros | ForEach-Object { Write-Host $_ }
            throw 'remover-versao-pwa.ps1 tem erro de sintaxe.'
          }

      # Sem o Git AutoSync (que vem de outro repositório) e sem o instalador NSIS: o que
      # se quer aqui é saber que o electron-builder ainda monta o app.
      - name: Empacotar a pasta do aplicativo
        working-directory: desktop
        run: |
          node scripts/preparar-autosync.mjs --sem-autosync
          npx electron-builder --config electron-builder.yml --dir
