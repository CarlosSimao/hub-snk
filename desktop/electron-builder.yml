# Empacotamento do HUB SNK desktop — ver docs/distribuicao.md.
#
# Antes de rodar: `node scripts/preparar-hub.mjs`, que monta `build/hub` com o backend e
# só as dependências de produção, e `node scripts/preparar-autosync.mjs`, que monta
# `build/git-autosync`. `npm run empacotar` faz os dois. `build/hub` vira `resources/hub`,
# o caminho que `desktop/src/config.ts` procura quando `app.isPackaged`.
appId: br.dev.hubsnk.desktop
productName: HUB SNK
copyright: Carlos Nascimento

directories:
  output: ../release
  buildResources: assets

# O shell: o que o Electron carrega. O backend NÃO entra aqui — ele é recurso, não
# código do app, e precisa ficar fora do `app.asar` para ser executado como processo.
files:
  - dist/**/*
  - assets/**/*
  - index.html
  - renderer.js
  - menu.html
  - menu.js
  - atalhos.html
  - atalhos.js
  - package.json

extraResources:
  - from: build/hub
    to: hub
    # O filtro explícito NÃO é decorativo: sem ele o electron-builder aplica o padrão que
    # descarta `node_modules`, e o pacote sai com o backend sem uma única dependência —
    # ele nem chega a responder o `/api/healthz`. Medido: `resources/hub` saiu com
    # `dist/`, `public/` e `config/` e mais nada.
    filter:
      - '**/*'
  # Entrada separada para o `node_modules`, e ela é obrigatória: mesmo com o filtro
  # acima, o electron-builder não copia um `node_modules` que esteja DENTRO de um
  # `extraResources` — ele o trata como árvore de dependências do app, não como
  # conteúdo. Medido nas duas primeiras tentativas: `resources/hub` saiu com 1,6 MB
  # (sem dependência nenhuma) em vez dos cerca de 31 MB corretos.
  - from: build/hub/node_modules
    to: hub/node_modules
    filter:
      - '**/*'
  # Git AutoSync: binários, o instalador silencioso, a skill e o VERSION. Montado por
  # `scripts/preparar-autosync.mjs`, que recusa binário mais antigo que os fontes. A
  # pasta existe mesmo no pacote sem autosync (vazia), porque origem inexistente derruba
  # o empacotamento.
  - from: build/git-autosync
    to: git-autosync
    filter:
      - '**/*'
  # Fora do `app.asar` porque quem o executa é o PowerShell, chamado pelo `installer.nsh`,
  # e o PowerShell não enxerga dentro do asar.
  - from: instalador
    to: instalador
    filter:
      - '*.ps1'

# `asar: true` mantém o shell num arquivo só. O backend está fora dele (extraResources),
# que é o necessário para o `spawn` do `src/index.ts` funcionar.
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/hub-snk.ico
  # `true` é o que grava o ícone e a versão no `.exe`. Assinatura não há: sem certificado
  # configurado (`CSC_LINK`), o electron-builder não assina nada, e o SmartScreen avisa.
  signAndEditExecutable: true

nsis:
  # Per-user: instala em %LOCALAPPDATA%\Programs\HUB SNK, sem pedir administrador.
  # É o que permite instalar numa máquina corporativa sem acionar o time de infra.
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: HUB SNK
  # A desinstalação remove os binários; `userData` (cofre das credenciais, cookies das
  # guias e logs) fica. Apagar dados de quem só está reinstalando seria irreversível.
  deleteAppDataOnUninstall: false
  artifactName: HUB-SNK-Setup-${version}.${ext}
  # Página de componentes do Git AutoSync e as chamadas de instalação/desinstalação dele.
  # O arquivo se desliga sozinho quando o pacote é montado sem o autosync.
  include: installer.nsh

linux:
  # Dormente: a distribuição é só para Windows, e nenhum workflow gera este alvo.
  # AppImage é o equivalente ao NSIS per-user: roda sem root, sem instalar nada no
  # sistema. O `.deb` fica para quem prefere pacote gerenciado, e é ele que declara as
  # dependências de chaveiro.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: assets/hub-snk.png
  category: Development
  synopsis: Cadastro de clientes e ambiente Sankhya
  artifactName: hub-snk-${version}-${arch}.${ext}

deb:
  # `libsecret` é requisito de SEGURANÇA, não de conveniência: sem chaveiro do sistema o
  # safeStorage do Electron cai para o backend `basic_text`, que cifra com chave fixa e
  # pública. O shell recusa gravar segredo nesse estado (ver desktop/src/cofreCredenciais),
  # então sem estas dependências o cofre simplesmente não funciona.
  depends:
    - libsecret-1-0
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
  recommends:
    - gnome-keyring
    - git

# Atualização automática (desktop/src/atualizacao.ts): o `electron-updater` lê o
# `latest.yml` da release mais recente deste repositório, público, sem token. Com isto o
# electron-builder grava o `app-update.yml` dentro do app e gera o `latest.yml` e o
# `.blockmap` junto do instalador. Quem sobe os três para a release é o workflow
# `distribuicao.yml`: os scripts de empacotamento rodam com `--publish never`.
publish:
  provider: github
  owner: CarlosSimao
  repo: hub-snk
