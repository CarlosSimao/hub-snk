<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Atalhos</title>
    <style>
      * {
        box-sizing: border-box;
      }
      /* As cores são as do menu flutuante: a janela abre a partir dele. */
      html,
      body {
        margin: 0;
        background: #1b1f27;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: #e6e6e6;
      }
      main {
        padding: 6px 16px 16px;
      }
      h2 {
        margin: 14px 0 6px;
        color: #7d8595;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      dl {
        margin: 0;
      }
      .atalho {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 0;
        border-bottom: 1px solid #2a2f3a;
      }
      .atalho:last-child {
        border-bottom: none;
      }
      dt {
        flex: none;
        margin-left: auto;
        order: 2;
      }
      dd {
        margin: 0;
      }
      kbd {
        display: inline-block;
        padding: 2px 6px;
        border: 1px solid #3a404d;
        border-bottom-width: 2px;
        border-radius: 5px;
        background: #232833;
        font-family: inherit;
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }
      .rodape {
        margin: 14px 0 0;
        color: #7d8595;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <main id="secoes"></main>
    <script src="atalhos.js"></script>
  </body>
</html>
