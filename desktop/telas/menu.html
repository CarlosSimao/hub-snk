<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>Menu</title>
    <style>
      * {
        box-sizing: border-box;
      }
      /* A camada cobre a janela inteira e é transparente: só o cartão aparece, e clicar no
     resto é "clicar fora". */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        color: #e6e6e6;
        user-select: none;
      }
      #fundo {
        position: fixed;
        inset: 0;
      }

      #menu {
        position: fixed;
        min-width: 250px;
        max-height: calc(100vh - 16px);
        overflow-y: auto;
        padding: 6px;
        background: #1b1f27;
        border: 1px solid #2a2f3a;
        border-radius: 10px;
        box-shadow:
          0 14px 34px rgba(0, 0, 0, 0.5),
          0 2px 6px rgba(0, 0, 0, 0.3);
        font-size: 13px;
        animation: surgir 0.09s ease-out;
      }
      @keyframes surgir {
        from {
          opacity: 0;
          transform: translateY(-4px) scale(0.98);
        }
      }

      .titulo {
        padding: 8px 10px 4px;
        color: #7d8595;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      /* Cada seção a partir da segunda começa com um traço acima do título. */
      .titulo:not(:first-child) {
        margin-top: 6px;
        padding-top: 10px;
        border-top: 1px solid #2a2f3a;
      }
      .nota {
        padding: 6px 10px 4px 36px;
        color: #7d8595;
        font-size: 11.5px;
      }

      .item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 7px 10px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .item:hover,
      .item:focus-visible {
        background: #232833;
        outline: none;
      }
      .item .marca {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }
      .item.caixa .marca {
        border: 1.5px solid #4a5160;
        transition:
          background 0.1s ease,
          border-color 0.1s ease;
      }
      .item.caixa.marcado .marca {
        background: #25d366;
        border-color: #25d366;
      }
      .item .marca svg {
        display: none;
      }
      .item.caixa.marcado .marca svg {
        display: block;
      }
      .item .atalho {
        margin-left: auto;
        padding-left: 18px;
        color: #7d8595;
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="fundo"></div>
    <div id="menu" role="menu" hidden></div>
    <script src="menu.js"></script>
  </body>
</html>
