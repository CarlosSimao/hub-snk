<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>HUB SNK</title>
    <style>
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        color: #e6e6e6;
        user-select: none;
      }
      #fundo {
        position: fixed;
        inset: 0;
      }
      .cartao {
        position: fixed;
        background: #1b1f27;
        border: 1px solid #2a2f3a;
        border-radius: 12px;
        box-shadow:
          0 14px 34px rgba(0, 0, 0, 0.5),
          0 2px 6px rgba(0, 0, 0, 0.3);
        font-size: 13px;
        animation: surgir 0.12s ease-out;
      }
      @keyframes surgir {
        from {
          opacity: 0;
          transform: translateY(-6px) scale(0.98);
        }
      }

      /* Lista de downloads */
      #downloads {
        width: 380px;
        max-height: calc(100vh - 16px);
        display: flex;
        flex-direction: column;
        padding: 6px;
      }
      .cabecalho {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 8px 8px;
        color: #7d8595;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .cabecalho button {
        border: none;
        background: transparent;
        color: #7d8595;
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        cursor: pointer;
        border-radius: 4px;
        padding: 2px 6px;
      }
      .cabecalho button:hover {
        background: #232833;
        color: #e6e6e6;
      }
      #lista {
        overflow-y: auto;
      }
      .linha {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        border-radius: 8px;
      }
      .linha:hover {
        background: #232833;
      }
      .linha .corpo {
        flex: 1;
        min-width: 0;
        padding: 0;
        border: none;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: default;
      }
      .linha.abrivel .corpo {
        cursor: pointer;
      }
      .linha .nome {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }
      .linha .situacao {
        margin-top: 2px;
        color: #7d8595;
        font-size: 11.5px;
      }
      .linha.falha .situacao {
        color: #e0786b;
      }
      .icone {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: #12151b;
        color: #7d8595;
      }
      .linha.abrivel .icone {
        color: #25d366;
      }
      .barra {
        height: 3px;
        margin-top: 6px;
        border-radius: 2px;
        background: #12151b;
        overflow: hidden;
      }
      .barra > div {
        height: 100%;
        background: #2d6cdf;
        transition: width 0.2s ease;
      }
      .barra.indeterminada > div {
        width: 40% !important;
        animation: correr 1.1s ease-in-out infinite;
      }
      @keyframes correr {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
      .pasta {
        flex: none;
        display: flex;
        padding: 6px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #7d8595;
        cursor: pointer;
      }
      .pasta:hover {
        background: #2a2f3a;
        color: #e6e6e6;
      }
      .vazio {
        padding: 18px;
        color: #7d8595;
        text-align: center;
      }

      /* Aviso de canto */
      #aviso {
        inset: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 14px;
        border-color: #2d6cdf;
      }
      #aviso .selo {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: #2d6cdf;
        color: #fff;
      }
      #aviso .titulo {
        font-size: 14px;
        font-weight: 600;
      }
      #aviso .texto {
        margin-top: 3px;
        color: #aab2c0;
        font-size: 12.5px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <div id="fundo" hidden></div>
    <div id="downloads" class="cartao" role="dialog" aria-label="Downloads" hidden>
      <div class="cabecalho">
        <span>Downloads</span>
        <button type="button" id="limpar">Limpar lista</button>
      </div>
      <div id="lista"></div>
    </div>
    <div id="aviso" class="cartao" role="status" hidden>
      <div class="selo" aria-hidden="true">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v5M12 16.5v.01" />
        </svg>
      </div>
      <div>
        <div class="titulo" id="aviso-titulo"></div>
        <div class="texto" id="aviso-texto"></div>
      </div>
    </div>
    <script src="camada.js"></script>
  </body>
</html>
