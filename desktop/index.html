<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <title>HUB SNK</title>
    <style>
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #12151b;
        color: #e6e6e6;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* Barra lateral de comunicação: altura toda, à esquerda das guias. O painel do serviço
     abre ao lado dela, por cima das guias — ver src/comunicacao.ts. */
      #lateral {
        --cor-destaque-lateral: #25d366;
        position: relative;
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 48px;
        background: #0d1015;
        border-right: 1px solid #333;
      }
      #servicos {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #servicos button {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: #7d8595;
        cursor: pointer;
        transition:
          background 0.12s ease,
          color 0.12s ease;
      }
      #servicos button svg {
        display: block;
      }
      #servicos button:hover,
      #servicos button.ativa {
        background: #1b1f27;
        color: var(--cor-destaque-lateral);
      }
      /* Traço à esquerda do botão aberto, como o indicador de guia ativa. */
      #servicos button.ativa::before {
        content: '';
        position: absolute;
        left: -6px;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 0 2px 2px 0;
        background: var(--cor-destaque-lateral);
      }

      /* Contador de conversas não lidas, no canto do ícone. */
      #servicos .contador {
        position: absolute;
        top: 1px;
        right: 1px;
        min-width: 15px;
        height: 15px;
        padding: 0 4px;
        border-radius: 8px;
        background: var(--cor-destaque-lateral);
        color: #0d1015;
        font-size: 10px;
        font-weight: 700;
        line-height: 15px;
        text-align: center;
      }
      /* Serviço que só avisa que há não lidas, sem dizer quantas (o Chat). */
      #servicos .contador.ponto {
        top: 5px;
        right: 5px;
        min-width: 9px;
        height: 9px;
        padding: 0;
      }
      /* Mensagem nova com o serviço fechado: pisca até você abrir e ler. */
      #servicos button.piscando {
        animation: piscar 1s ease-in-out infinite;
      }
      @keyframes piscar {
        50% {
          background: rgba(37, 211, 102, 0.22);
          color: var(--cor-destaque-lateral);
        }
      }
      /* Engrenagem separada dos serviços: é configuração, não um serviço. */
      #servicos #configurarServicos {
        margin-top: 13px;
      }
      #servicos #configurarServicos::before {
        content: '';
        position: absolute;
        top: -10px;
        left: 8px;
        right: 8px;
        height: 1px;
        background: #2a2f3a;
      }

      /* Alça de ocultar: apagada até o hover, para não disputar atenção com os serviços. */
      /* Fora do fluxo: os serviços ficam centralizados na altura, e a alça no rodapé. */
      #alternarLateral {
        position: absolute;
        bottom: 6px;
        left: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #4a5160;
        cursor: pointer;
        opacity: 0.6;
        transition:
          opacity 0.12s ease,
          color 0.12s ease;
      }
      #alternarLateral:hover {
        opacity: 1;
        color: #e6e6e6;
      }
      #alternarLateral svg {
        display: block;
        transition: transform 0.12s ease;
      }
      /* Oculta, a barra vira uma faixa fina que inteira é a alça de reabrir. */
      body.lateral-oculta #lateral {
        width: 10px;
      }
      body.lateral-oculta #servicos {
        display: none;
      }
      body.lateral-oculta #alternarLateral {
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
      body.lateral-oculta #alternarLateral svg {
        transform: rotate(180deg);
      }

      #principal {
        flex: 1;
        min-width: 0;
      }

      /* A barra e a "trilha" das guias: mesmo fundo do corpo, borda só embaixo — é nela que
     a guia ativa "encosta" pra dar a sensação de continuar no conteúdo abaixo. */
      #barra {
        display: flex;
        align-items: flex-end;
        gap: 0;
        padding: 8px 10px 0;
        background: #12151b;
        border-bottom: 1px solid #333;
        flex-wrap: wrap;
      }

      /* Guia fixa do menu: sem borda nem fundo de guia, para não competir com as guias de
     conteúdo — só destaca no hover. */
      #menu {
        align-self: stretch;
        display: flex;
        align-items: center;
        margin-right: 2px;
        padding: 0 6px;
        border: none;
        border-radius: 6px 6px 0 0;
        background: transparent;
        color: #7d8595;
        cursor: pointer;
      }
      /* SVG em vez do caractere ☰: a fonte desenha as três linhas com espessuras e vãos
     desiguais. */
      #menu svg {
        display: block;
        fill: currentColor;
      }
      #menu:hover {
        background: #1b1f27;
        color: #e6e6e6;
      }

      #abas,
      #abasClientes {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        flex-wrap: wrap;
      }

      /* Guia de navegador: cantos só em cima, sem borda embaixo (a ativa cobre o traço da
     barra), levemente mais baixa quando inativa — realça qual guia "está na frente". */
      #abas button,
      .aba-cliente {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 14px;
        margin-bottom: 0;
        border: 1px solid #333;
        border-bottom: none;
        border-radius: 8px 8px 0 0;
        background: #1b1f27;
        color: #b7bfcc;
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        transition:
          background 0.12s ease,
          color 0.12s ease;
      }
      #abas button:hover,
      .aba-cliente:hover {
        background: #232833;
        color: #e6e6e6;
      }
      #abas button.ativa,
      .aba-cliente.ativa {
        background: #2d6cdf;
        color: #fff;
        border-color: #2d6cdf;
        box-shadow:
          0 -2px 0 0 #2d6cdf inset,
          0 -3px 8px rgba(0, 0, 0, 0.25);
        position: relative;
        z-index: 1;
      }

      .aba-cliente .fechar {
        opacity: 0;
        padding: 0 2px;
        border-radius: 3px;
      }
      .aba-cliente:hover .fechar,
      .aba-cliente.ativa .fechar {
        opacity: 0.75;
      }
      .aba-cliente .fechar:hover {
        opacity: 1;
        background: rgba(255, 255, 255, 0.15);
      }

      /* Controles ficam fora da fileira de guias — navegador de verdade nunca mistura ação
     de navegação com guia. */
      #controles {
        display: flex;
        align-items: center;
        margin-left: auto;
        padding-bottom: 5px;
      }
      #recarregar {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        padding: 0;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #7d8595;
        cursor: pointer;
        transition:
          background 0.12s ease,
          color 0.12s ease;
      }
      #recarregar:hover {
        background: #1b1f27;
        color: #e6e6e6;
      }
      #recarregar svg {
        display: block;
      }
      /* Um giro por clique: confirma que o comando saiu, sem ficar girando à toa. */
      #recarregar.girando svg {
        animation: girar 0.5s ease;
      }
      @keyframes girar {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <nav id="lateral" aria-label="Comunicação">
      <div id="servicos">
        <button data-servico="whatsapp" title="WhatsApp" aria-label="WhatsApp">
          <span class="contador" hidden></span>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.3z" />
            <path
              d="M9.2 8.6c0 3.4 2.8 6.2 6.2 6.2l1.2-1.4-2-1-1 .8a4.6 4.6 0 0 1-2.8-2.8l.8-1-1-2z"
            />
          </svg>
        </button>
        <button data-servico="gmail" title="Gmail" aria-label="Gmail">
          <span class="contador" hidden></span>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M3.5 6.5 12 13l8.5-6.5" />
          </svg>
        </button>
        <button data-servico="chat" title="Google Chat" aria-label="Google Chat">
          <span class="contador" hidden></span>
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M4 4.5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9.5L5 20v-3.5H4a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z"
            />
          </svg>
        </button>
        <button
          id="configurarServicos"
          title="Escolher os botões da barra"
          aria-label="Escolher os botões da barra"
          aria-haspopup="menu"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"
            />
          </svg>
        </button>
      </div>
      <button
        id="alternarLateral"
        title="Ocultar barra de comunicação"
        aria-label="Ocultar barra de comunicação"
        aria-expanded="true"
      >
        <svg
          width="10"
          height="10"
          viewBox="0 0 10 10"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M6.5 2 3.5 5l3 3" />
        </svg>
      </button>
    </nav>
    <div id="principal">
      <div id="barra">
        <button id="menu" title="Menu" aria-label="Menu" aria-haspopup="menu">
          <svg width="12" height="10" viewBox="0 0 12 10" aria-hidden="true">
            <rect y="0" width="12" height="2" rx="1" />
            <rect y="4" width="12" height="2" rx="1" />
            <rect y="8" width="12" height="2" rx="1" />
          </svg>
        </button>
        <div id="abas">
          <button data-id="hub" class="ativa">Painel</button>
          <button data-id="erp">SankhyaOm</button>
          <button data-id="experience">Experience</button>
        </div>
        <div id="abasClientes"></div>
        <div id="controles">
          <button id="recarregar" title="Recarregar a guia ativa" aria-label="Recarregar">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <path d="M21 3v6h-6" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
